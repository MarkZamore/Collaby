global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
- job_name: otel
  static_configs:
  - targets:
    - otel:9464
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
- job_name: netdata
  metrics_path: /api/v1/allmetrics
  params:
    format:
    - prometheus
  static_configs:
  - targets:
    - server:19999

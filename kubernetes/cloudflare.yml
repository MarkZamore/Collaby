apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudflare, namespace: collaby, labels: {app.kubernetes.io/part-of: collaby}}
spec:
  replicas: 1
  selector: {matchLabels: {app: cloudflare}}
  template:
    metadata: {labels: {app: cloudflare, app.kubernetes.io/part-of: collaby}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflare
          image: cloudflare/cloudflared:2026.5.2@sha256:12ff5c6992a9863db4da270746af7c244bcaee49353039af8104268a18d6c4f0
          args: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', run]
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 2000}
            periodSeconds: 30
          startupProbe:
            tcpSocket: {port: 2000}
            failureThreshold: 30
            periodSeconds: 10
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: cloudflare, key: tunnel-token}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
